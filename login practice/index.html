<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./index.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="form-container">
      <div class="sign-up sign1">
        <h3 class="sign">Sign up</h3>
        <div class="form-field1 f1 hidden">
          <form action="">
            <label for="Fname">Firsname: </label>
            <input type="text" placeholder="Enter your first name" required />
            <label for="Fname">Surname: </label>
            <input type="text" placeholder="Enter your surname" required />
            <label for="Fname">Email: </label>
            <input type="text" placeholder="example@example.com" required />
            <label for="Fname">Password: </label>
            <input type="password" placeholder="*******" required />
            <input class="btn" type="submit" value="Submit" />
          </form>
        </div>
      </div>
      <div class="login log1 expand">
        <h3 class="log">Login</h3>
        <div class="form-field2 f2">
          <form action="">
            <label for="Email">Email</label>
            <input type="text" placeholder="enter your email or username" />
            <label for="Email">Password</label>
            <input type="password" placeholder="enter your password" />
            <input class="btn" type="submit" value="Login" />
          </form>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
